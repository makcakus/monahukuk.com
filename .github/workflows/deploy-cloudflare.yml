name: Deploy to Cloudflare Workers

# Cloudflare Workers Builds denendi ama 30 dk sert build timeout'una
# çarptı (3071 sayfalık build ~59 dk sürüyor, bkz. build #b3fbf110 log'u).
# Repo public'e alındı (public repolarda GH Actions dakikası ücretsiz/
# sınırsız) ve deploy GitHub Actions'a geri döndü — burada sert bir
# build süresi sınırı yok.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: |
          npm run fix:yaml
          npm run validate

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'content/**', 'messages/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build OpenNext bundle
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_BOOKING_URL: ${{ vars.NEXT_PUBLIC_BOOKING_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Ensure R2 cache bucket exists
        # mona-site-cache eski bucket birikmiş veriyle R2 internal error (10001)
        # veriyordu — yeni boş mona-site-cache-v2 bucket'ına geçildi.
        run: npx wrangler r2 bucket create mona-site-cache-v2 || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        # `opennextjs-cloudflare deploy` önce R2 cache'i doldurur, SONRA
        # worker'ı deploy eder — cache adımı patlarsa (R2 internal error 10001,
        # bucket/eşzamanlılık farketmeden 5 deploy'da tekrarladı) worker HİÇ
        # deploy edilmiyor. OPEN_NEXT_DEPLOY=true ile wrangler'ın otomatik
        # opennextjs-cloudflare deploy'a sarma davranışını atlayıp cache'e
        # bağımlı olmayan düz bir worker deploy'u yapıyoruz. Site cache boşken
        # de sayfaları anında render eder (ISR mantığı), sadece ilk istek
        # cache'e yazılana kadar biraz daha yavaş olur.
        run: OPEN_NEXT_DEPLOY=true npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Warm R2 incremental cache (best-effort)
        # Site zaten canlı olduğu için bu adımın başarısız olması deploy'u
        # engellemiyor — sadece performans ön-ısıtması.
        run: npx opennextjs-cloudflare populateCache remote --cacheChunkSize 2 || echo "Cache warm-up başarısız oldu, site zaten canlı — devam ediliyor."
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
