name: Deploy to Cloudflare Workers

# Cloudflare Workers Builds denendi ama 30 dk sert build timeout'una
# çarptı (3071 sayfalık build ~59 dk sürüyor, bkz. build #b3fbf110 log'u).
# Repo public'e alındı (public repolarda GH Actions dakikası ücretsiz/
# sınırsız) ve deploy GitHub Actions'a geri döndü — burada sert bir
# build süresi sınırı yok.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: |
          npm run fix:yaml
          npm run validate

      - name: Generate locale manifests
        # `opennextjs-cloudflare build` next build'i doğrudan çağırdığı için
        # package.json'daki "prebuild" hook'u (generate:locale-manifest)
        # çalışmıyor. src/generated/*.json elle güncellenmezse içerikten geri
        # kalıyor: makale dil fallback'i (article-fallbacks.json) ve dil
        # değiştirici yeni makaleleri tanımıyor, bu da GSC'de "Bulunamadı
        # (404)" üretiyordu. Her deploy'da içerikten yeniden üretiyoruz.
        run: npm run generate:locale-manifest

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'content/**', 'messages/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build OpenNext bundle
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_BOOKING_URL: ${{ vars.NEXT_PUBLIC_BOOKING_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Ensure R2 cache bucket exists
        # mona-site-cache eski bucket birikmiş veriyle R2 internal error (10001)
        # veriyordu — yeni boş mona-site-cache-v2 bucket'ına geçildi.
        run: npx wrangler r2 bucket create mona-site-cache-v2 || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Populate R2 incremental cache (before deploy)
        # Yeni build ID'sinin cache kayıtları worker'dan ÖNCE yazılıyor. Eskiden
        # sıra tersti: worker canlıya çıkıyor, cache 10-25 dk sonra doluyordu;
        # bu pencerede (ve cache adımı hata verirse kalıcı olarak) makale
        # sayfaları 404 dönebiliyordu (bkz. scripts/deploy-full.mjs uyarısı).
        # populateCache kendi geçici worker'ını kullanır, canlı worker'a
        # bağımlı değildir; eski worker bu sırada eski build ID'siyle sorunsuz
        # çalışmaya devam eder. R2 hatası (10001) yine de deploy'u
        # engellemesin diye continue-on-error, ama artık sessizce yutulmuyor.
        id: populate
        run: npx opennextjs-cloudflare populateCache remote --cacheChunkSize 2
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        # `opennextjs-cloudflare deploy` cache adımı patlarsa (R2 internal error
        # 10001) worker'ı HİÇ deploy etmiyordu. OPEN_NEXT_DEPLOY=true ile
        # wrangler'ın otomatik opennextjs-cloudflare deploy'a sarma davranışını
        # atlayıp düz bir worker deploy'u yapıyoruz; cache bir önceki adımda
        # zaten dolduruldu.
        run: OPEN_NEXT_DEPLOY=true npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Retry R2 cache population after failed pre-deploy attempt
        # Ön doldurma başarısız olduysa site cache'siz canlıda — tekrar dene,
        # yine olmazsa run özetinde görünür bir uyarı bırak.
        if: steps.populate.outcome == 'failure'
        run: |
          npx opennextjs-cloudflare populateCache remote --cacheChunkSize 2 \
            || echo "::warning title=R2 cache doldurulamadı::Worker cache'siz canlıda; makale sayfaları 404 dönebilir. 'npx opennextjs-cloudflare populateCache remote' ile elle doldurun."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
